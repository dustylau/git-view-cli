name: git-view-ci

x-gitea-image: &gitea-image docker.io/gitea/gitea:1.27.3@sha256:87a67ee09d3ae0d1df5fda5dcda3e2a1f9236a45b0a59025d6e00e46adc43bef

services:
  git:
    image: *gitea-image
    restart: unless-stopped
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__database__SQLITE_JOURNAL_MODE: WAL
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__ROOT_URL: http://127.0.0.1:${LOCAL_CI_PORT:-3080}/
      GITEA__server__LOCAL_ROOT_URL: http://git:3000/
      GITEA__server__DISABLE_SSH: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__repository__FORCE_PRIVATE: "true"
      GITEA__actions__ENABLED: "true"
    ports:
      - "127.0.0.1:${LOCAL_CI_PORT:-3080}:3000"
    volumes:
      - git-data:/data
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:3000/api/healthz"]
      interval: 2s
      timeout: 2s
      start_period: 2m
      retries: 60

  provision:
    image: *gitea-image
    depends_on:
      git:
        condition: service_healthy
    entrypoint: [sh, /ci/provision.sh]
    volumes:
      - git-data:/data
      - local-credentials:/credentials
      - runner-token:/runner-token
      - ./tools/ci/provision.sh:/ci/provision.sh:ro

  runner:
    image: docker.io/gitea/runner:5.2.0@sha256:f4db24cc5f682483ffd01b8de6a6c6d15e6fd9320a0ce27fd18d4398db421eae
    restart: unless-stopped
    depends_on:
      provision:
        condition: service_completed_successfully
    environment:
      CONFIG_FILE: /ci/runner.yaml
      GITEA_INSTANCE_URL: http://git:3000
      GITEA_RUNNER_NAME: git-view-local
      GITEA_RUNNER_REGISTRATION_TOKEN_FILE: /runner-token/token
      GITEA_RUNNER_LABELS: local-ci:docker://${COMPOSE_PROJECT_NAME}-tools:local
      LOCAL_CI_NETWORK: ${COMPOSE_PROJECT_NAME}_default
    volumes:
      - runner-data:/data
      - runner-token:/runner-token:ro
      - ./tools/ci/runner.yaml:/ci/runner.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock

  bootstrap:
    profiles: [bootstrap]
    build: tools/ci
    image: ${COMPOSE_PROJECT_NAME}-tools:local
    depends_on:
      runner:
        condition: service_started
    environment:
      LOCAL_CI_REPO: ${LOCAL_CI_REPO:-git-view-cli}
      LOCAL_CI_URL: http://127.0.0.1:${LOCAL_CI_PORT:-3080}
    volumes:
      - type: bind
        source: ${LOCAL_CI_SOURCE:-.}
        target: /checkout
        read_only: true
        bind:
          create_host_path: false
      - local-credentials:/credentials:ro
    entrypoint: [python3, /ci/bootstrap.py]

volumes:
  git-data:
  local-credentials:
  runner-token:
  runner-data:
